<div class="d-flex" id="admin-layout">
  <!-- Mobile Menu Toggle -->
  <button class="mobile-menu-toggle d-md-none" 
          (click)="toggleMobileMenu()" 
          [class.active]="isMobileMenuOpen">
    <span></span>
    <span></span>
    <span></span>
  </button>

  <!-- Mobile Overlay -->
  <div class="mobile-overlay d-md-none" 
       [class.show]="isMobileMenuOpen" 
       (click)="closeMobileMenu()"></div>

  <!-- Sidebar -->
  <nav class="bg-dark text-white p-3 min-vh-100 position-fixed admin-sidebar" 
       [class.mobile-open]="isMobileMenuOpen">
    
    <!-- Mobile Close Button -->
    <div class="mobile-close-container d-md-none d-flex justify-content-between align-items-center mb-4">
      <h5 class="text-light mb-0">
        <i class="fas fa-cog me-2"></i>ITConsult Admin
      </h5>
      <button class="mobile-close-btn" (click)="closeMobileMenu()">
        <i class="fas fa-times"></i>
      </button>
    </div>

    <!-- Desktop Header -->
    <h5 class="text-light mb-4 d-none d-md-block">
      <i class="fas fa-cog me-2"></i>ITConsult Admin
    </h5>
    <ul class="nav flex-column">

      <li class="nav-item mb-2" routerLinkActive="active" [routerLinkActiveOptions]="{exact: false}">
        <a routerLink="/admin-dashboard" 
           class="nav-link text-white d-flex align-items-center"
           (click)="closeMobileMenu()">
          <i class="fas fa-tachometer-alt me-3"></i> Dashboard
        </a>
      </li>

      <li class="nav-item mb-2" routerLinkActive="active" [routerLinkActiveOptions]="{exact: false}">
        <a routerLink="/admin-services" 
           class="nav-link text-white d-flex align-items-center"
           (click)="closeMobileMenu()">
          <i class="fas fa-tools me-3"></i> Services
        </a>
      </li>

      <li class="nav-item mb-2" routerLinkActive="active" [routerLinkActiveOptions]="{exact: false}">
        <a routerLink="/admin-blogs" 
           class="nav-link text-white d-flex align-items-center"
           (click)="closeMobileMenu()">
          <i class="fas fa-blog me-3"></i> Blog Manager
        </a>
      </li>

      <li class="nav-item mb-2" routerLinkActive="active" [routerLinkActiveOptions]="{exact: false}">
        <a routerLink="/admin-jobs" 
           class="nav-link text-white d-flex align-items-center"
           (click)="closeMobileMenu()">
          <i class="fas fa-briefcase me-3"></i> Job Manager
        </a>
      </li>

      <li class="nav-item mb-2" routerLinkActive="active" [routerLinkActiveOptions]="{exact: false}">
        <a routerLink="/admin-team" 
           class="nav-link text-white d-flex align-items-center"
           (click)="closeMobileMenu()">
          <i class="fas fa-users me-3"></i> Team Manager
        </a>
      </li>

      <li class="nav-item mb-2" routerLinkActive="active" [routerLinkActiveOptions]="{exact: false}">
        <a routerLink="/admin-projects" 
           class="nav-link text-white d-flex align-items-center"
           (click)="closeMobileMenu()">
          <i class="fas fa-project-diagram me-3"></i> Project Manager
        </a>
      </li>

      <li class="nav-item mb-2" routerLinkActive="active" [routerLinkActiveOptions]="{exact: false}">
        <a routerLink="/admin-testimonials" 
           class="nav-link text-white d-flex align-items-center"
           (click)="closeMobileMenu()">
          <i class="fas fa-star me-3"></i> Testimonials
        </a>
      </li>

      <li class="nav-item mb-2" routerLinkActive="active" [routerLinkActiveOptions]="{exact: false}">
        <a routerLink="/admin-static-pages" 
           class="nav-link text-white d-flex align-items-center"
           (click)="closeMobileMenu()">
          <i class="fas fa-file-alt me-3"></i> Static Pages
        </a>
      </li>

      <li class="nav-item mb-2" routerLinkActive="active" [routerLinkActiveOptions]="{exact: false}">
        <a routerLink="/admin-site-settings" 
           class="nav-link text-white d-flex align-items-center"
           (click)="closeMobileMenu()">
          <i class="fas fa-cogs me-3"></i> Site Settings
        </a>
      </li>

      <li class="nav-item mb-2" routerLinkActive="active" [routerLinkActiveOptions]="{exact: false}">
        <a routerLink="/admin-feature-toggles" 
           class="nav-link text-white d-flex align-items-center"
           (click)="closeMobileMenu()">
          <i class="fas fa-toggle-on me-3"></i> Feature Toggles
        </a>
      </li>

      <li class="nav-item mb-2" routerLinkActive="active" [routerLinkActiveOptions]="{exact: false}">
        <a routerLink="/admin-enquiries" 
           class="nav-link text-white d-flex align-items-center"
           (click)="closeMobileMenu()">
          <i class="fas fa-envelope me-3"></i> Enquiries
        </a>
      </li>

      <li class="nav-item mt-4">
        <a class="nav-link text-danger d-flex align-items-center" href="#">
          <i class="fas fa-sign-out-alt me-3"></i> Logout
        </a>
      </li>
      
    </ul>
  </nav>

  <!-- Content Area -->
  <main class="admin-main-content">
    <div class="admin-content-wrapper">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
