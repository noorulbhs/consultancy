<div class="container mt-5" style="max-width: 500px;">
  <h3 class="text-center mb-4">Admin Login</h3>

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <div class="mb-3">
      <label for="username" class="form-label">Email</label>
      <input
        type="email"
        formControlName="username"
        class="form-control"
        id="username"
        [class.is-invalid]="loginForm.get('username')?.invalid && loginForm.get('username')?.touched"
      />
      <div class="invalid-feedback" *ngIf="loginForm.get('username')?.hasError('required')">
        Email is required.
      </div>
      <div class="invalid-feedback" *ngIf="loginForm.get('username')?.hasError('email')">
        Invalid email.
      </div>
    </div>

    <div class="mb-3 position-relative">
      <label for="password" class="form-label">Password</label>
      <div class="input-group">
        <input
          [type]="hidePassword ? 'password' : 'text'"
          formControlName="password"
          class="form-control"
          id="password"
          [class.is-invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
        />
        <span class="input-group-text" style="cursor: pointer" (click)="hidePassword = !hidePassword">
          <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
        </span>
      </div>
      <div class="invalid-feedback" *ngIf="loginForm.get('password')?.hasError('required')">
        Password is required.
      </div>
      <div class="invalid-feedback" *ngIf="loginForm.get('password')?.hasError('minlength')">
        Password must be at least 6 characters.
      </div>
    </div>

    <button type="submit" class="btn btn-primary w-100 mt-3" [disabled]="loginForm.invalid">
      Login
    </button>

    <div class="alert alert-danger mt-3" *ngIf="loginFailed">
      Invalid credentials. Please try again.
    </div>
  </form>
</div>
