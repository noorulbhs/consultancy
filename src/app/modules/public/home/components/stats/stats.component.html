<section class="stats-section">
  <div class="container">
    <div class="row">
      <div class="col-lg-8 mx-auto text-center mb-5">
        <h2 class="section-title">Our Track Record</h2>
        <p class="section-subtitle">Numbers that speak for our expertise and commitment to excellence</p>
      </div>
    </div>
    
    <div class="row g-4">
      <div class="col-xl-3 col-lg-4 col-md-6" *ngFor="let stat of stats">
        <div class="stat-card text-center">
          <div class="stat-icon bg-primary rounded-circle d-flex align-items-center justify-content-center mx-auto mb-3" style="width: 60px; height: 60px; font-size: 2rem; box-shadow: 0 2px 8px rgba(0,0,0,0.08);">
            <i [class]="stat.icon" style="color: #fff;"></i>
          </div>
          <div class="stat-number">{{ stat.number }}</div>
          <div class="stat-label">{{ stat.label }}</div>
        </div>
      </div>
    </div>
  </div>
</section>
