<section class="cta-section">
  <div class="container">
    <div class="cta-wrapper">
      <!-- Header Section -->
      <div class="cta-header">
        <div class="cta-badge">
          <div class="badge-icon">
            <i class="fas fa-rocket"></i>
          </div>
          <span class="badge-text">Transform Your Business Today</span>
          <div class="badge-shine"></div>
        </div>
        
        <h2 class="cta-title">
          Ready to <span class="highlight">Transform</span><br>
          Your Business with <span class="accent">Expert</span> IT Solutions?
        </h2>
        
        <p class="cta-subtitle">{{ ctaData.subtitle }}</p>
      </div>

      <!-- Main Content Grid -->
      <div class="cta-grid">
        <!-- Call to Action -->
        <div class="cta-right">
          <div class="cta-card">
            <div class="card-header">
              <div class="card-icon">
                <i class="fas fa-comments"></i>
              </div>
              <h3 class="card-title">Start Your Journey</h3>
              <p class="card-subtitle">Get expert guidance in just 3 simple steps</p>
            </div>
            
            <div class="cta-actions">
              <a [routerLink]="ctaData.primaryAction.link" class="cta-btn-primary">
                <span class="btn-icon">
                  <i class="fas fa-calendar-check"></i>
                </span>
                <span class="btn-content">
                  <span class="btn-text">{{ ctaData.primaryAction.text }}</span>
                  <span class="btn-subtext">Free 30-min consultation</span>
                </span>
                <div class="btn-arrow">
                  <i class="fas fa-arrow-right"></i>
                </div>
                <div class="btn-glow"></div>
              </a>
              
              <a [routerLink]="ctaData.secondaryAction.link" class="cta-btn-secondary">
                <span class="btn-icon">
                  <i class="fas fa-eye"></i>
                </span>
                <span class="btn-text">{{ ctaData.secondaryAction.text }}</span>
              </a>
            </div>
            
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <!-- Enhanced Background Elements -->
  <div class="cta-bg-elements">
    <div class="floating-shape shape-1"></div>
    <div class="floating-shape shape-2"></div>
    <div class="floating-shape shape-3"></div>
    <div class="floating-shape shape-4"></div>
    <div class="floating-shape shape-5"></div>
    <div class="floating-shape shape-6"></div>
    <div class="grid-pattern"></div>
    <div class="light-beam beam-1"></div>
    <div class="light-beam beam-2"></div>
  </div>
</section>
