<div class="container my-5">

  <!-- Title and Intro -->
  <section class="text-center mb-5">
    <h2>Our Services</h2>
    <p class="text-muted">Explore the wide range of IT solutions we offer to transform your business digitally.</p>
  </section>

  <!-- Service Cards -->
  <section>
    <div class="row row-cols-1 row-cols-md-3 g-4">
      <div class="col" *ngFor="let s of services">
        <div class="card h-100 shadow-sm">
          <div class="card-body">
            <h5 class="card-title">{{ s.title }}</h5>
            <p class="card-text">{{ s.description }}</p>
          </div>
          <div class="card-footer bg-white border-0">
            <a [routerLink]="['/services', s.id]" class="btn btn-outline-primary btn-sm w-100">Learn More</a>
          </div>
        </div>
      </div>
    </div>
  </section>

</div>
