<div class="container py-5">
  <div class="row">
    <div class="col-12 text-center mb-5">
      <h1 class="display-4 fw-bold text-primary">Contact Us</h1>
      <p class="lead text-muted">Get in touch with our team for expert IT consulting</p>
    </div>
  </div>
  
  <div class="row">
    <!-- Contact Information -->
    <div class="col-lg-4 mb-5">
      <div class="card border-0 shadow-sm h-100">
        <div class="card-body p-4">
          <h3 class="h4 fw-bold mb-4">Get In Touch</h3>
          
          <div class="mb-4">
            <div class="d-flex align-items-center mb-3">
              <i class="fas fa-map-marker-alt fa-lg text-primary me-3"></i>
              <div>
                <h6 class="mb-0">Address</h6>
                <p class="text-muted mb-0">123 Business Street<br>Tech City, TC 12345</p>
              </div>
            </div>
            
            <div class="d-flex align-items-center mb-3">
              <i class="fas fa-phone fa-lg text-primary me-3"></i>
              <div>
                <h6 class="mb-0">Phone</h6>
                <p class="text-muted mb-0">+1 (555) 123-4567</p>
              </div>
            </div>
            
            <div class="d-flex align-items-center mb-3">
              <i class="fas fa-envelope fa-lg text-primary me-3"></i>
              <div>
                <h6 class="mb-0">Email</h6>
                <p class="text-muted mb-0">info&#64;itconsult.com</p>
              </div>
            </div>
            
            <div class="d-flex align-items-center">
              <i class="fas fa-clock fa-lg text-primary me-3"></i>
              <div>
                <h6 class="mb-0">Business Hours</h6>
                <p class="text-muted mb-0">Mon - Fri: 9:00 AM - 6:00 PM</p>
              </div>
            </div>
          </div>
          
          <div>
            <h6 class="fw-bold mb-3">Follow Us</h6>
            <div class="d-flex gap-3">
              <a href="#" class="text-primary"><i class="fab fa-linkedin fa-2x"></i></a>
              <a href="#" class="text-primary"><i class="fab fa-twitter fa-2x"></i></a>
              <a href="#" class="text-primary"><i class="fab fa-facebook fa-2x"></i></a>
            </div>
          </div>
        </div>
      </div>
    </div>
    
    <!-- Contact Form -->
    <div class="col-lg-8">
      <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
          <h3 class="h4 fw-bold mb-4">Send Us a Message</h3>
          
          <form (ngSubmit)="onSubmit()" #contactForm="ngForm">
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">Full Name <span class="text-danger">*</span></label>
                <input 
                  type="text" 
                  class="form-control" 
                  [(ngModel)]="formData.name"
                  name="name"
                  required>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Email Address <span class="text-danger">*</span></label>
                <input 
                  type="email" 
                  class="form-control" 
                  [(ngModel)]="formData.email"
                  name="email"
                  required>
              </div>
            </div>
            
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">Phone Number</label>
                <input 
                  type="tel" 
                  class="form-control" 
                  [(ngModel)]="formData.phone"
                  name="phone">
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Company</label>
                <input 
                  type="text" 
                  class="form-control" 
                  [(ngModel)]="formData.company"
                  name="company">
              </div>
            </div>
            
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">Subject <span class="text-danger">*</span></label>
                <select 
                  class="form-select" 
                  [(ngModel)]="formData.subject"
                  name="subject"
                  required>
                  <option value="">Select a subject</option>
                  <option value="general">General Inquiry</option>
                  <option value="consultation">Free Consultation</option>
                  <option value="support">Technical Support</option>
                  <option value="partnership">Partnership</option>
                  <option value="career">Career Opportunities</option>
                </select>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Service of Interest</label>
                <select 
                  class="form-select" 
                  [(ngModel)]="formData.service"
                  name="service">
                  <option value="">Select a service</option>
                  <option value="Cloud Migration">Cloud Migration</option>
                  <option value="DevOps Strategy">DevOps Strategy</option>
                  <option value="Application Development">Application Development</option>
                  <option value="Data Analytics">Data Analytics</option>
                  <option value="Cybersecurity">Cybersecurity</option>
                  <option value="IT Strategy">IT Strategy</option>
                </select>
              </div>
            </div>
            
            <div class="mb-4">
              <label class="form-label">Message <span class="text-danger">*</span></label>
              <textarea 
                class="form-control" 
                rows="5" 
                [(ngModel)]="formData.message"
                name="message"
                placeholder="Tell us about your project or inquiry..."
                required></textarea>
            </div>
            
            <div class="d-flex justify-content-between align-items-center">
              <p class="text-muted mb-0"><span class="text-danger">*</span> Required fields</p>
              <button 
                type="submit" 
                class="btn btn-primary px-4"
                [disabled]="!contactForm.form.valid || isSubmitting">
                <span *ngIf="isSubmitting" class="spinner-border spinner-border-sm me-2"></span>
                {{ isSubmitting ? 'Sending...' : 'Send Message' }}
              </button>
            </div>
          </form>
          
          <div *ngIf="submitMessage" class="alert mt-3" 
               [class.alert-success]="submitSuccess"
               [class.alert-danger]="!submitSuccess">
            {{ submitMessage }}
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
